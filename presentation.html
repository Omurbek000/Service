<script type="text/babel">
const {useState,useEffect,useRef} = React;

const steps = [
  {id:1, title:'Upload', desc:'POST /videos/ multipart', icon:'⬆️', color:'from-violet-600 to-indigo-600', time:'0.3с'},
  {id:2, title:'Extract', desc:'ffmpeg 16кГц mono', icon:'🎧', color:'from-blue-600 to-cyan-600', time:'0.3с'},
  {id:3, title:'Whisper', desc:'faster-whisper base', icon:'🧠', color:'from-emerald-600 to-teal-600', time:'5.9с'},
  {id:4, title:'Diarize', desc:'pyannote + gender', icon:'👥', color:'from-amber-600 to-orange-600', time:'mock'},
  {id:5, title:'Translate', desc:'NLLB-200 ru', icon:'🌐', color:'from-pink-600 to-rose-600', time:'230с'},
  {id:6, title:'TTS', desc:'edge-tts Dmitry', icon:'🗣️', color:'from-red-600 to-pink-600', time:'6с'},
  {id:7, title:'Mux', desc:'atempo + assemble', icon:'🎬', color:'from-indigo-600 to-violet-600', time:'1.2с'},
];

const endpoints = [
  {m:'POST', p:'/auth/register/', d:'Регистрация', c:'bg-emerald-500'},
  {m:'POST', p:'/auth/login/', d:'JWT access/refresh', c:'bg-emerald-500'},
  {m:'POST', p:'/videos/', d:'Загрузка mp4/mov 413 лимит', c:'bg-violet-500'},
  {m:'GET', p:'/videos/{id}/preview-transcript/', d:'detected_language en 0.62', c:'bg-blue-500'},
  {m:'POST', p:'/jobs/', d:'mode subtitles|dubbing', c:'bg-amber-500'},
  {m:'GET', p:'/jobs/{id}/', d:'progress voice_mode result_files', c:'bg-blue-500'},
  {m:'GET', p:'/voices/?lang=ru', d:'14 пресетов', c:'bg-zinc-500'},
  {m:'WS', p:'ws/jobs/{id}/?token=', d:'job_progress/completed', c:'bg-pink-500'},
];

function useInView(ref){
  const [v,setV]=useState(false);
  useEffect(()=>{
    const o=new IntersectionObserver(([e])=>{if(e.isIntersecting) setV(true)},{threshold:0.2});
    if(ref.current) o.observe(ref.current);
    return()=>o.disconnect();
  },[]);
  return v;
}

function Pipeline(){
  const [active,setActive]=useState(0);
  useEffect(()=>{
    const id=setInterval(()=>setActive(a=>(a+1)%steps.length),900);
    return()=>clearInterval(id);
  },[]);
  return (
    <div className="relative">
      <div className="absolute top-[28px] left-[8%] right-[8%] h-[2px] bg-white/10 hidden lg:block"></div>
      <div className="absolute top-[28px] left-[8%] h-[2px] bg-gradient-to-r from-violet-600 to-pink-600 transition-all duration-700 hidden lg:block" style={{width:`${(active/(steps.length-1))*84}%`}}></div>
      <div className="flex lg:grid lg:grid-cols-7 gap-3 overflow-x-auto pb-2 lg:pb-0 snap-x snap-mandatory">
        {steps.map((s,i)=>(
          <div key={s.id} className={`snap-center shrink-0 w-[148px] lg:w-auto relative rounded-2xl p-4 border transition-all duration-500 ${i===active?'bg-white text-zinc-900 border-white scale-[1.03] shadow-xl -translate-y-1':'bg-white/[0.06] border-white/10 backdrop-blur'}`}>
            <div className={`w-9 h-9 rounded-xl bg-gradient-to-br ${s.color} flex items-center justify-center text-sm mb-3 ${i===active?'':'opacity-90'}`}>{s.icon}</div>
            <div className={`text-xs font-extrabold tracking-widest ${i===active?'text-violet-600':'text-white/60'}`}>0{i+1}</div>
            <div className={`font-extrabold leading-none ${i===active?'text-zinc-900':'text-white'}`}>{s.title}</div>
            <div className={`text-[11px] leading-tight mt-1 ${i===active?'text-zinc-600':'text-white/60'}`}>{s.desc}</div>
            <div className={`mt-2 text-[10px] font-mono px-1.5 py-0.5 rounded-full inline-block ${i===active?'bg-zinc-900 text-white':'bg-white/10 text-white/70'}`}>{s.time}</div>
            {i===active && <div className="absolute -bottom-1 left-1/2 -translate-x-1/2 w-2 h-2 bg-white rotate-45 hidden lg:block"></div>}
          </div>
        ))}
      </div>
      <div className="lg:hidden text-center text-[11px] font-mono text-white/40 mt-2">← свайп →</div>
    </div>
  )
}

function Counter({to}){
  const [n,setN]=useState(0);
  const ref=useRef(null);
  const vis=useInView(ref);
  useEffect(()=>{if(!vis) return; let s=0; const id=setInterval(()=>{s+=Math.ceil(to/30); if(s>=to){s=to; clearInterval(id);} setN(s)},30); return()=>clearInterval(id)},[vis,to]);
  return <span ref={ref}>{n}</span>;
}

function TryIt(){
  const [run,setRun]=useState(false);
  const [p,setP]=useState(0);
  const [step,setStep]=useState('idle');
  const logs=[
    {at:8, t:'POST /videos/ → 201 uploading'},
    {at:18, t:'extract_audio ffmpeg 16кГц → language_detection'},
    {at:35, t:'Whisper base: en 0.62 → I want you to turn...'},
    {at:55, t:'GET /videos/{id}/ → detected_language en'},
    {at:70, t:'POST /jobs/ dubbing ru → queued'},
    {at:82, t:'translate en→ru NLLB: Я хочу...'},
    {at:92, t:'TTS edge-tts Dmitry 6.02с → atempo 9.42с'},
    {at:98, t:'mux -c:v copy → output_ru_dubbed.mp4 6.6МБ'},
  ];
  useEffect(()=>{
    if(!run) return;
    setP(0); setStep('uploading');
    const seq=[
      [8,'uploading'],[18,'language_detection'],[35,'transcribing'],[55,'awaiting_user_choice'],[70,'translating'],[82,'tts'],[92,'mux'],[100,'completed']
    ];
    let i=0;
    const id=setInterval(()=>{
      if(i>=seq.length){clearInterval(id); setRun(false); return;}
      setP(seq[i][0]); setStep(seq[i][1]); i++;
    },700);
    return()=>clearInterval(id);
  },[run]);
  return (
    <div className="bg-white text-zinc-900 rounded-[24px] p-5 shadow-xl">
      <div className="flex items-center justify-between">
        <h3 className="font-extrabold">Try it — живой прогресс</h3>
        <span className={`text-[11px] font-mono px-2.5 py-1 rounded-full border ${step==='completed'?'bg-emerald-500 text-white border-emerald-500':'bg-zinc-900 text-white border-zinc-900'}`}>{step}</span>
      </div>
      <div className="mt-4 h-2 bg-zinc-100 rounded-full overflow-hidden">
        <div className="h-full bg-gradient-to-r from-violet-600 to-pink-600 transition-all duration-700" style={{width:`${p}%`}}></div>
      </div>
      <div className="mt-2 flex justify-between text-[11px] font-mono text-zinc-500"><span>0%</span><span className="font-bold text-violet-600">{p}%</span><span>100%</span></div>
      <div className="mt-4 bg-zinc-900 rounded-xl p-3 font-mono text-[11px] leading-relaxed max-h-[160px] overflow-auto">
        {logs.filter(l=>l.at<=p).map((l,idx)=>(
          <div key={idx} className="flex gap-2 py-1 border-b border-white/5 last:border-0 animate-[fadeIn_0.3s_ease]">
            <span className="text-white/40">{l.at}%</span>
            <span className={l.at===p?'text-emerald-300':'text-white/80'}>{l.t}</span>
          </div>
        ))}
        {p===0 && <span className="text-white/40">Нажми «Запустить» — увидишь как фронт поллит GET /jobs/{'{id}'} или слушает WS ws/jobs/{'{id}'}/?token=</span>}
        {p===100 && <div className="mt-2 bg-emerald-500 text-white rounded-lg px-3 py-2 font-bold">✓ completed — качай output_ru.srt / output_ru_dubbed.mp4</div>}
      </div>
      <button onClick={()=>setRun(true)} disabled={run} className={`mt-4 w-full font-extrabold py-3 rounded-full transition ${run?'bg-zinc-200 text-zinc-500 cursor-not-allowed':'bg-zinc-900 text-white hover:bg-black'}`}>{run?'▶️ Идёт...':'▶️ Запустить демо-поток'}</button>
      <div className="mt-2 text-[11px] text-zinc-500 font-mono">Мок-поллинг: без БД, но 1-в-1 как process_job_task + JobLog + WS</div>
    </div>
  )
}
